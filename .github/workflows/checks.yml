name: Reranker checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python lab.py train
      - run: python lab.py evaluate --split test
      - uses: actions/upload-artifact@v7
        with:
          name: reranker-reports
          path: reports/
